name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Fired by the source repo's CI after a push to personal-site, and usable by
  # hand. The source repo passes the exact commit to build as an input, so two
  # rapid pushes cannot race.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA of personal-astro-site to build
        required: false
        default: personal-site
      sha:
        description: Commit to build, overrides ref when set
        required: false
        type: string

# This repo serves no site code of its own. It checks out personal-astro-site,
# builds it, and publishes the result. The Pages API only accepts deployments
# from the repo where Pages is enabled, which is why the workflow lives here
# rather than alongside the site source.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages serves one deployment at a time, so a newer push supersedes any run
# still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # The source repo passes the exact commit it wants built as an input.
      # Pinning to that SHA rather than the branch name means two rapid pushes
      # cannot race, with the second run silently building a commit newer than
      # the one that fired it.
      - name: Resolve source ref
        id: src
        env:
          SHA: ${{ inputs.sha }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$SHA" ]; then
            ref="$SHA"
            echo "source: requested $REF @ $SHA"
          elif [ -n "$REF" ]; then
            ref="$REF"
            echo "source: $REF"
          else
            ref="personal-site"
            echo "source: default personal-site"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout site source
        uses: actions/checkout@v5
        with:
          repository: shwaaa21/personal-astro-site
          ref: ${{ steps.src.outputs.ref }}
          path: site

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # GitHub reads the URL and name back from the environment so the deploy
    # shows up on the Pages settings page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
